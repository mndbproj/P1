name: Update Iran SOCKS proxy list

on:
  schedule:
    # Every 3 hours. Free proxies die fast; adjust to taste in Actions minutes budget.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch + validate proxies
        working-directory: scripts
        run: python main.py

      - name: Commit updated proxy list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/proxies.json docs/socks.txt docs/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Iran SOCKS proxy list [skip ci]"
            git push
          fi
